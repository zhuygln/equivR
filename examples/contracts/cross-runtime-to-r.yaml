# Benchmark class 2: cross-runtime trusted reference -> R.
# The reference was produced once in another runtime (SAS or Python) and is
# shipped as a pregenerated artifact, so CI never needs that runtime.
version: equivr-contract/v1
name: cross-runtime-to-r
description: >
  Treatment-by-visit summary table exported from a non-R reference runtime,
  re-implemented in R. Means and standard deviations are compared with a
  tolerance that absorbs differences in floating-point summation order.
reference:
  path: reference/vs_summary.csv
  format: csv
  description: Pregenerated by the reference runtime; see benchmark.yaml
candidate:
  path: candidate/vs_summary.csv
  format: csv
keys: [TRTP, AVISITN, PARAMCD]
fields:
  required: [TRTP, AVISITN, PARAMCD, N, MEAN, SD]
  exact: [N]
  ignore: [AVISIT]
missing:
  default: match
  fields:
    N: forbid
tolerance:
  abs: 1.0e-8
  rel: 1.0e-8
  fields:
    SD:
      abs: 1.0e-6
